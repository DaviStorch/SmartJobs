<div xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(#{common.errorTitle}, '', ~{::main})}">
<main class="error-page">
    <span class="eyebrow" th:text="${(currentAccount != null && currentAccount.language == 'en' ? 'ERROR ' : 'ERRO ') + status}">ERRO</span><h1 th:text="#{common.errorTitle}">Não foi possível concluir</h1>
    <p th:text="${message}">Ocorreu um erro.</p><a class="button button-primary" th:href="@{/}" th:text="#{common.backHome}">Voltar ao início</a>
</main>
</div>
