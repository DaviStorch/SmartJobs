spring.application.name=SmartJobs
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartjobs}
spring.datasource.username=${DATABASE_USERNAME:smartjobs}
spring.datasource.password=${DATABASE_PASSWORD:smartjobs}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.messages.fallback-to-system-locale=false
spring.docker.compose.lifecycle-management=start_only

smartjobs.ocr.tesseract=${SMARTJOBS_OCR_TESSERACT:}
smartjobs.ocr.language=${SMARTJOBS_OCR_LANGUAGE:por+eng}
smartjobs.ocr.max-pages=${SMARTJOBS_OCR_MAX_PAGES:20}

smartjobs.ai.enabled=${SMARTJOBS_AI_ENABLED:false}
smartjobs.ai.endpoint=${SMARTJOBS_AI_ENDPOINT:http://localhost:11434/v1/chat/completions}
smartjobs.ai.model=${SMARTJOBS_AI_MODEL:qwen2.5:3b}
smartjobs.ai.api-key=${SMARTJOBS_AI_API_KEY:}
smartjobs.ai.timeout-seconds=${SMARTJOBS_AI_TIMEOUT_SECONDS:15}

smartjobs.gmail.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
smartjobs.gmail.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
smartjobs.gmail.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:}
smartjobs.gmail.encryption-key=${SMARTJOBS_GMAIL_ENCRYPTION_KEY:}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
