spring.application.name=SmartJobs
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartjobs}
spring.datasource.username=${DATABASE_USERNAME:smartjobs}
spring.datasource.password=${DATABASE_PASSWORD:smartjobs}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.messages.fallback-to-system-locale=false
spring.docker.compose.lifecycle-management=start_only

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
