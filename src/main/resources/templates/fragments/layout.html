<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:lang="${currentAccount != null && currentAccount.language == 'en' ? 'en' : 'pt-BR'}"
      th:fragment="shell(pageTitle, activeItem, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="description" content="SmartJobs — organização inteligente da sua busca por oportunidades.">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="icon" th:href="@{/images/icon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title th:text="${pageTitle + ' · SmartJobs'}">SmartJobs</title>
</head>
<body th:attr="data-theme=${currentAccount != null ? currentAccount.theme : 'light'}, lang=${currentAccount != null ? currentAccount.language : 'pt'}">
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <a class="brand" th:href="@{/}" aria-label="SmartJobs início">
            <span class="brand-mark">S</span><span>smart<span class="brand-light">jobs</span><small>CAREER WORKSPACE</small></span>
        </a>
        <div class="nav-caption">WORKSPACE</div>
        <nav class="main-nav">
            <a th:href="@{/}" th:classappend="${activeItem == 'dashboard' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg><span th:text="#{nav.dashboard}">Visão geral</span>
            </a>
            <a th:href="@{/jobs}" th:classappend="${activeItem == 'jobs' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></svg><span th:text="#{nav.jobs}">Oportunidades</span>
            </a>
            <a th:href="@{/resumes}" th:classappend="${activeItem == 'resumes' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M8 12h8M8 16h8"/></svg><span th:text="#{nav.resumes}">Currículos</span>
            </a>
            <a th:href="@{/statistics}" th:classappend="${activeItem == 'statistics' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 6-7"/></svg><span th:text="#{nav.statistics}">Estatísticas</span>
            </a>
        </nav>
        <div class="sidebar-bottom">
            <div class="sidebar-note"><span class="note-dot"></span><span th:text="#{nav.search}">Organize sua próxima oportunidade</span></div>
            <div class="account-row">
                <div class="avatar" th:text="${currentAccount != null ? #strings.substring(currentAccount.name, 0, 1).toUpperCase() : 'S'}">S</div>
                <div class="account-meta"><strong th:text="${currentAccount != null ? currentAccount.name : 'SmartJobs'}">SmartJobs</strong><small>Personal workspace</small></div>
                <form th:action="@{/logout}" method="post"><button class="icon-button logout-button" type="submit" th:aria-label="#{nav.logout}" title="Sair"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg></button></form>
            </div>
        </div>
    </aside>
    <div class="workspace">
        <header class="topbar">
            <button type="button" class="icon-button menu-button" data-menu-toggle aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <div class="breadcrumb"><span>SmartJobs</span><i>/</i><strong th:text="${pageTitle}">Visão geral</strong></div>
            <div class="topbar-actions">
                <form class="preferences" th:action="@{/preferences}" method="post">
                    <label class="sr-only" for="theme-select" th:text="#{common.theme}">Tema</label>
                    <select id="theme-select" name="theme" th:aria-label="#{common.theme}" onchange="this.form.submit()">
                        <option value="light" th:selected="${currentAccount == null || currentAccount.theme == 'light'}">Claro</option>
                        <option value="dark" th:selected="${currentAccount != null && currentAccount.theme == 'dark'}">Escuro</option>
                    </select>
                    <label class="sr-only" for="language-select" th:text="#{common.language}">Idioma</label>
                    <select id="language-select" name="language" th:aria-label="#{common.language}" onchange="this.form.submit()">
                        <option value="pt" th:selected="${currentAccount == null || currentAccount.language == 'pt'}">PT</option>
                        <option value="en" th:selected="${currentAccount != null && currentAccount.language == 'en'}">EN</option>
                    </select>
                </form>
                <span class="topbar-date" th:text="${#temporals.format(#temporals.createNow(), 'dd MMM yyyy')}">09 Nov 2026</span>
                <div class="avatar avatar-small" th:text="${currentAccount != null ? #strings.substring(currentAccount.name, 0, 1).toUpperCase() : 'S'}">S</div>
            </div>
        </header>
        <main class="page-content" th:replace="${content}">
            <p>Conteúdo SmartJobs</p>
        </main>
    </div>
</div>
<div class="mobile-scrim" data-menu-toggle></div>
<div class="toast-container" th:if="${success != null or error != null}">
    <div class="toast-message" th:classappend="${error != null ? 'toast-error' : ''}" role="status">
        <span th:text="${success != null ? success : error}">Ação concluída.</span>
    </div>
</div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
